# City names for rule D-30 (hygiene). One entry per city: the name to standardise to, then every other name,
# old name, short form or common misspelling that means the same city. Matching ignores case, spaces and punctuation
# ("New Delhi", "new-delhi" and "NEWDELHI" are one name). Edit this file freely; nothing here is hard-coded in the rule.
#
# Not merged on purpose: "Delhi NCR" is its own entry (a region, kept as one city), and Navi Mumbai, Secunderabad and
# Thane are cities of their own.
#
# A short form listed for two cities is ignored (it would be a guess).

