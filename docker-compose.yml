# One host, three containers. Only the proxy publishes ports; the service and the model are reachable only on the
# internal network, and the model's network has no route to the internet.
#
#   cp .env.example .env      # set DQ_API_TOKEN, STRUCTURE_HASH_KEY, DQ_DOMAIN
#   docker compose up -d --build
#   docker compose --profile setup run --rm model-pull qwen2.5:7b-instruct      # download a model (once per model)
name: dq

services:
  proxy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DQ_DOMAIN: ${DQ_DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    depends_on:
      app: { condition: service_healthy }

  app:
    build: .
    image: dq-service:${DQ_VERSION:-local}
    restart: unless-stopped
    environment:
      DQ_ENV: production
      DQ_API_TOKEN: ${DQ_API_TOKEN:?set DQ_API_TOKEN in .env (16+ characters)}
      STRUCTURE_HASH_KEY: ${STRUCTURE_HASH_KEY:?set STRUCTURE_HASH_KEY in .env (32+ random characters)}
      STRUCTURE_LLM_URL: http://ollama:11434
      DQ_LLM_ALLOWED_HOSTS: ollama             # the only host prompts may be sent to: the container below
      DQ_LLM_MODEL: ${DQ_LLM_MODEL:-llama3.2:3b}
      DQ_AGENT_MODEL: ${DQ_AGENT_MODEL:-qwen2.5:7b-instruct}
      DQ_RETENTION_DAYS: ${DQ_RETENTION_DAYS:-}
      DQ_MAX_CONCURRENT_JOBS: ${DQ_MAX_CONCURRENT_JOBS:-2}
      DQ_TRUSTED_PROXIES: "*"                  # only the proxy container can reach this port (network `edge`)
      DQ_SHUTDOWN_GRACE_S: "30"
    volumes:
      - dq_data:/data
    networks: [edge, models]
    stop_grace_period: 45s
    init: true                                 # reaps worker processes, forwards SIGTERM
    read_only: true
    tmpfs: ["/tmp:size=2g", "/home/dq:size=256m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: { cpus: "4", memory: 8g }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  ollama:
    image: ollama/ollama:latest                # pin to a digest for production (DEPLOYMENT.md, "Pinning images")
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    networks: [models]
    deploy:
      resources:
        limits: { memory: 16g }
    # GPU: uncomment on a host with the NVIDIA container toolkit
    #    reservations:
    #      devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

  # One-off helper to download a model: the `ollama` service itself has no internet access.
  #   docker compose --profile setup run --rm model-pull qwen2.5:7b-instruct
  model-pull:
    image: ollama/ollama:latest
    profiles: [setup]
    volumes:
      - ollama_models:/root/.ollama
    entrypoint: ["/bin/sh", "-c", "ollama serve >/dev/null 2>&1 & sleep 3; ollama pull \"$0\"; status=$?; kill %1; exit $status"]
    command: ["llama3.2:3b"]

networks:
  edge: {}
  models:
    internal: true                             # no route out: prompts and client data cannot leave the host from here

volumes:
  dq_data: {}
  ollama_models: {}
  caddy_data: {}
  caddy_config: {}
