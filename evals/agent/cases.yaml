# Evaluation cases for the agent's planner (src/agent/evaluation.py explains the scoring).
#
#   tier  command      wording the chat documents (help text, docs/transformations.md): the parser should read it
#         paraphrase   the same intent in an analyst's own words: mostly needs the local model
#         adversarial  must NOT become a change: injection, unknown names, out-of-phase requests, "delete everything"
#   expect  {ops: [names in order], first: {dotted field of the first op: value}}  |  ask  |  answer  |  no_change
#
# Phase B table (Media): Date, City, Channel, Status, Spend, Orders, AOV, Region      (8 rows, Excel rows 2-9)
# Phase T tables: Reactivation, Coupons, Affiliate, Channels, AOV, Orders, DAP Base, DAP New, Audience, Influencer, OOH
#
# A case is never edited to make a planner pass. If a planner is wrong, the case stays and the number shows it.
cases:
  # ───────────────────────── Phase B · documented commands ─────────────────────────
  - {id: B-C01, tier: command, phase: B, text: "accept all date fixes", expect: {ops: [resolve_findings], first: {decision: accept}}}
  - {id: B-C02, tier: command, phase: B, text: "accept all date fixes except row 8", expect: {ops: [resolve_findings], first: {decision: accept, where.exclude_rows: [8]}}}
  - {id: B-C03, tier: command, phase: B, text: "reject the date fixes", expect: {ops: [resolve_findings], first: {decision: reject}}}
  - {id: B-C04, tier: command, phase: B, text: "keep row 8", expect: {ops: [resolve_findings], first: {decision: keep, where.rows: [8]}}}
  - {id: B-C05, tier: command, phase: B, text: "Head Office is Bangalore", expect: {ops: [replace_values], first: {mapping: {Head Office: Bangalore}, columns: [City]}}}
  - {id: B-C06, tier: command, phase: B, text: "change Radio and Print to Offline in Channel", expect: {ops: [replace_values], first: {mapping: {Radio: Offline, Print: Offline}, columns: [Channel]}}}
  - {id: B-C07, tier: command, phase: B, text: "Draft in Status means empty", expect: {ops: [replace_values], first: {columns: [Status]}}}
  - {id: B-C08, tier: command, phase: B, text: "remove '$' from Spend", expect: {ops: [replace_text], first: {column: Spend, find: "$"}}}
  - {id: B-C09, tier: command, phase: B, text: "set Region to West where City is Pune", expect: {ops: [set_value], first: {column: Region, value: West}}}
  - {id: B-C10, tier: command, phase: B, text: "in row 5 set City to Delhi", expect: {ops: [set_value], first: {column: City, value: Delhi, where.rows: [5]}}}
  - {id: B-C11, tier: command, phase: B, text: "make Status Live for rows 2 to 4", expect: {ops: [set_value], first: {column: Status, value: Live, where.rows: [2, 3, 4]}}}
  - {id: B-C12, tier: command, phase: B, text: "fill empty Orders with 0", expect: {ops: [set_value], first: {column: Orders, value: "0"}}}
  - {id: B-C13, tier: command, phase: B, text: "fill empty Region with Unknown", expect: {ops: [set_value], first: {column: Region, value: Unknown}}}
  - {id: B-C14, tier: command, phase: B, text: "Spend is in thousands", expect: {ops: [scale], first: {columns: [Spend], factor: 1000}}}
  - {id: B-C15, tier: command, phase: B, text: "divide AOV by 100", expect: {ops: [scale], first: {columns: [AOV], factor: 0.01}}}
  - {id: B-C16, tier: command, phase: B, text: "multiply Spend by 1.18", expect: {ops: [scale], first: {columns: [Spend], factor: 1.18}}}
  - {id: B-C17, tier: command, phase: B, text: "add column Revenue = Orders * AOV", expect: {ops: [add_column], first: {name: Revenue}}}
  - {id: B-C18, tier: command, phase: B, text: "add column Source with value Client", expect: {ops: [add_column], first: {name: Source, value: Client}}}
  - {id: B-C19, tier: command, phase: B, text: "add column Medium from Channel: TV = Offline, Radio = Offline, others = Online", expect: {ops: [add_column], first: {name: Medium, from_column: Channel, default: Online}}}
  - {id: B-C20, tier: command, phase: B, text: "rename column AOV to Avg_Order_Value", expect: {ops: [rename_column], first: {column: AOV, new_name: Avg_Order_Value}}}
  - {id: B-C21, tier: command, phase: B, text: "remove rows where Status is Test", expect: {ops: [remove_rows]}}
  - {id: B-C22, tier: command, phase: B, text: "remove rows 4, 7", expect: {ops: [remove_rows], first: {where.rows: [4, 7]}}}
  - {id: B-C23, tier: command, phase: B, text: "split Date into Year, Month and Day on -", expect: {ops: [split_column], first: {column: Date, into: [Year, Month, Day]}}}
  - {id: B-C24, tier: command, phase: B, text: "set Tier to Gold if Spend > 5000, Silver if Spend > 2000, else Bronze", expect: {ops: [classify], first: {column: Tier, default: Bronze}}}
  - {id: B-C25, tier: command, phase: B, text: "summary", expect: answer}
  - {id: B-C26, tier: command, phase: B, text: "help", expect: answer}
  - {id: B-C27, tier: command, phase: B, text: "explain D-02", expect: answer}
  - {id: B-C28, tier: command, phase: B, text: "set Status to Hold where Channel is TV and City is Bangalore", expect: {ops: [set_value], first: {column: Status, value: Hold}}}
  - {id: B-C29, tier: command, phase: B, text: "set Region to APAC where Spend > 5000", expect: {ops: [set_value], first: {column: Region, value: APAC}}}
  - {id: B-C30, tier: command, phase: B, text: "remove rows where Date >= 2026-02-01", expect: {ops: [remove_rows]}}

  # ───────────────────────── Phase T · documented commands ─────────────────────────
  - {id: T-C01, tier: command, phase: T, text: "unpivot Day 1 to Day 3 into rows as Day and Reactivated", expect: {ops: [unpivot], first: {table: Reactivation, values_to: Reactivated, names_to: Day}}}
  - {id: T-C02, tier: command, phase: T, text: "turn the Day columns into rows", expect: {ops: [unpivot], first: {table: Reactivation}}}
  - {id: T-C03, tier: command, phase: T, text: "split City into rows sharing Usage keeping Delhi NCR together", expect: {ops: [split_rows], first: {table: Coupons, column: City, allocate: [Usage], keep_together: [Delhi NCR]}}}
  - {id: T-C04, tier: command, phase: T, text: "split City into rows sharing Usage equally", expect: {ops: [split_rows], first: {method: equal}}}
  - {id: T-C05, tier: command, phase: T, text: "split Full Name into First and Last", expect: {ops: [split_column], first: {column: Full Name, into: [First, Last]}}}
  - {id: T-C06, tier: command, phase: T, text: "sum impressions, clicks, installs by day, channel, network", expect: {ops: [aggregate], first: {table: Affiliate, by: [day, channel, network], sum: [impressions, clicks, installs]}}}
  - {id: T-C07, tier: command, phase: T, text: "count rows by ORDER_DATE, ORDER_CITY as orders", expect: {ops: [aggregate], first: {table: Orders, count_as: orders}}}
  - {id: T-C08, tier: command, phase: T, text: "label channel not in Channels as Others also network then sum clicks, installs by day", expect: {ops: [bucket_others], first: {table: Affiliate, label: Others}}}
  - {id: T-C09, tier: command, phase: T, text: "allocate Budget, Reach by City from Audience using Pct matching Campaign", expect: {ops: [allocate_by_share], first: {table: Influencer, share_table: Audience, share: Pct, category: City}}}
  - {id: T-C10, tier: command, phase: T, text: "net next-month negatives in Cost by Month per Site", expect: {ops: [net_next_period], first: {table: OOH, value: Cost, period: Month}}}
  - {id: T-C11, tier: command, phase: T, text: "append DAP New to DAP Base where DATE >= 2025-09-09 renaming DATE as Date, CITY_NAME as City", expect: {ops: [append_rows], first: {table: DAP Base, source: DAP New}}}
  - {id: T-C12, tier: command, phase: T, text: "look up CURRENT_AOV from AOV matching ORDER_DATE = ORDER_DATE, ORDER_CITY = CITY_NAME in Orders", expect: {ops: [lookup_join], first: {table: Orders, lookup: AOV, columns: [CURRENT_AOV]}}}
  - {id: T-C13, tier: command, phase: T, text: "convert Spend from USD to INR at 83.2", expect: {ops: [convert_currency], first: {table: Coupons, columns: [Spend], rate: 83.2}}}
  - {id: T-C14, tier: command, phase: T, text: "sort Coupons by Date descending", expect: {ops: [sort_rows], first: {table: Coupons, by: [Date]}}}
  - {id: T-C15, tier: command, phase: T, text: "add Month as the month of Date in Coupons", expect: {ops: [make_period], first: {table: Coupons, unit: month}}}
  - {id: T-C16, tier: command, phase: T, text: "drop table Channels", expect: {ops: [drop_table], first: {table: Channels}}}
  - {id: T-C17, tier: command, phase: T, text: "drop columns Promo, Vehicle", expect: {ops: [drop_columns], first: {table: Coupons, columns: [Promo, Vehicle]}}}
  - {id: T-C18, tier: command, phase: T, text: "pivot Inactivity Bucket into columns using Day 1 by Month, City", expect: {ops: [pivot], first: {table: Reactivation, index: [Month, City]}}}
  - {id: T-C19, tier: command, phase: T, text: "keep top 1 channel, others as Others", expect: {ops: [bucket_others], first: {table: Affiliate, top_n: 1}}}
  - {id: T-C20, tier: command, phase: T, text: "add column Net = Amount * 0.82", expect: {ops: [add_column], first: {name: Net}}}
  - {id: T-C21, tier: command, phase: T, text: "rename column CITY_NAME to City in AOV", expect: {ops: [rename_column], first: {new_name: City}}}
  - {id: T-C22, tier: command, phase: T, text: "average CURRENT_AOV by CITY_NAME", expect: {ops: [aggregate], first: {table: AOV, mean: [CURRENT_AOV]}}}
  - {id: T-C23, tier: command, phase: T, text: "set Segment to HCV if Vehicle is Truck, else All", expect: {ops: [classify], first: {column: Segment, default: All}}}
  - {id: T-C24, tier: command, phase: T, text: "show recipe", expect: no_change}
  - {id: T-C25, tier: command, phase: T, text: "help", expect: answer}

